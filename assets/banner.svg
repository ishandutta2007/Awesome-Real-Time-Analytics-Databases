<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e1a"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><radialGradient id="cyan-glow" cx="20%" cy="30%" r="50%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".35"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="purple-glow" cx="80%" cy="40%" r="50%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><radialGradient id="emerald-glow" cx="50%" cy="85%" r="40%"><stop offset="0%" stop-color="#10b981" stop-opacity=".25"/><stop offset="100%" stop-color="#10b981" stop-opacity="0"/></radialGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="40%" stop-color="#818cf8"/><stop offset="80%" stop-color="#c084fc"/><stop offset="100%" stop-color="#34d399"/></linearGradient><linearGradient id="stream-grad-1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/><stop offset="50%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient><linearGradient id="stream-grad-2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981" stop-opacity="0"/><stop offset="50%" stop-color="#34d399" stop-opacity=".8"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></linearGradient><linearGradient id="pill-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".6" stdDeviation="8"/></filter><filter id="neon-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes dashMove{0%{stroke-dashoffset:400}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatMed{0%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes pingPoint{0%{r:3;opacity:.4}50%{r:6;opacity:1}}.pulse-bg-1{animation:pulseGlow 8s ease-in-out infinite;transform-origin:240px 120px}.pulse-bg-2{animation:pulseGlow 10s ease-in-out infinite reverse;transform-origin:960px 160px}.stream-line-1{stroke-dasharray:12 16;animation:dashMove 14s linear infinite}.stream-line-2{stroke-dasharray:16 20;animation:dashMove 18s linear infinite reverse}.stream-line-3{stroke-dasharray:8 12;animation:dashMove 10s linear infinite}.float-pill-1{animation:floatSlow 6s ease-in-out infinite}.float-pill-2{animation:floatMed 7s ease-in-out infinite 1s}.float-pill-3{animation:floatSlow 8s ease-in-out infinite 2s}.float-pill-4{animation:floatMed 6.5s ease-in-out infinite 1.5s}.node-pulse{animation:pingPoint 3s ease-in-out infinite}.mono-text{font-family:&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.sans-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}</style></defs><rect width="1200" height="420" fill="url(#bg-grad)"/><circle cx="240" cy="120" r="320" fill="url(#cyan-glow)" class="pulse-bg-1"/><circle cx="960" cy="160" r="340" fill="url(#purple-glow)" class="pulse-bg-2"/><circle cx="600" cy="380" r="280" fill="url(#emerald-glow)" opacity=".4"/><g stroke="#334155" stroke-width=".5" opacity=".25"><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="0" x2="1200" y1="350" y2="350"/><line x1="200" x2="200" y1="0" y2="420"/><line x1="400" x2="400" y1="0" y2="420"/><line x1="600" x2="600" y1="0" y2="420"/><line x1="800" x2="800" y1="0" y2="420"/><line x1="1000" x2="1000" y1="0" y2="420"/></g><g fill="none" opacity=".6"><path stroke="url(#stream-grad-1)" stroke-width="3" d="M-50,330 C200,280 400,380 650,320 C900,260 1050,340 1250,290" class="stream-line-1"/><path stroke="url(#stream-grad-2)" stroke-width="2.5" d="M-50,90 C250,140 450,40 700,100 C950,160 1080,80 1250,130" class="stream-line-2"/><path stroke="#818cf8" stroke-width="1.5" d="M-50,220 C220,180 500,260 800,190 C1000,140 1120,230 1250,180" class="stream-line-3" opacity=".4"/></g><g fill="#38bdf8" filter="url(#neon-glow)"><circle cx="220" cy="180" r="4" class="node-pulse"/><circle cx="480" cy="90" r="3" class="node-pulse" style="animation-delay:1s"/><circle cx="720" cy="330" r="4.5" class="node-pulse" style="animation-delay:1.8s"/><circle cx="980" cy="110" r="3.5" class="node-pulse" style="animation-delay:.6s"/><circle cx="1060" cy="270" r="4" class="node-pulse" style="animation-delay:2.3s"/></g><g class="float-pill-1" transform="translate(60, 45)"><rect width="130" height="32" fill="url(#pill-grad)" stroke="#06b6d4" stroke-opacity=".4" stroke-width="1" rx="16"/><text x="65" y="21" fill="#38bdf8" class="mono-text" font-size="12" font-weight="600" text-anchor="middle">⚡ ClickHouse</text></g><g class="float-pill-2" transform="translate(1010, 45)"><rect width="130" height="32" fill="url(#pill-grad)" stroke="#8b5cf6" stroke-opacity=".4" stroke-width="1" rx="16"/><text x="65" y="21" fill="#c084fc" class="mono-text" font-size="12" font-weight="600" text-anchor="middle">🍷 Apache Pinot</text></g><g class="float-pill-3" transform="translate(50, 345)"><rect width="125" height="32" fill="url(#pill-grad)" stroke="#10b981" stroke-opacity=".4" stroke-width="1" rx="16"/><text x="62" y="21" fill="#34d399" class="