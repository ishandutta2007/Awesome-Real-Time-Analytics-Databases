<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background & Glowing Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="cyan-glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purple-glow" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emerald-glow" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="stream-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="stream-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatMed {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes pingPoint {
        0%, 100% { r: 3; opacity: 0.4; }
        50% { r: 6; opacity: 1; }
      }

      .pulse-bg-1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 240px 120px; }
      .pulse-bg-2 { animation: pulseGlow 10s ease-in-out infinite reverse; transform-origin: 960px 160px; }
      .stream-line-1 { stroke-dasharray: 12 16; animation: dashMove 14s linear infinite; }
      .stream-line-2 { stroke-dasharray: 16 20; animation: dashMove 18s linear infinite reverse; }
      .stream-line-3 { stroke-dasharray: 8 12; animation: dashMove 10s linear infinite; }
      .float-pill-1 { animation: floatSlow 6s ease-in-out infinite; }
      .float-pill-2 { animation: floatMed 7s ease-in-out infinite 1s; }
      .float-pill-3 { animation: floatSlow 8s ease-in-out infinite 2s; }
      .float-pill-4 { animation: floatMed 6.5s ease-in-out infinite 1.5s; }
      .node-pulse { animation: pingPoint 3s ease-in-out infinite; }
      .mono-text { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>

  <!-- Glowing Radial Backdrops (Dynamic/Animated) -->
  <circle cx="240" cy="120" r="320" fill="url(#cyan-glow)" class="pulse-bg-1"/>
  <circle cx="960" cy="160" r="340" fill="url(#purple-glow)" class="pulse-bg-2"/>
  <circle cx="600" cy="380" r="280" fill="url(#emerald-glow)" opacity="0.4"/>

  <!-- Subtle Grid Lines (Architectural Aesthetic) -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- Dynamic Data Stream Wave Lines (Animated Background, non-intrusive) -->
  <g fill="none" opacity="0.6">
    <path d="M-50,330 C200,280 400,380 650,320 C900,260 1050,340 1250,290" 
          stroke="url(#stream-grad-1)" stroke-width="3" class="stream-line-1"/>
    <path d="M-50,90 C250,140 450,40 700,100 C950,160 1080,80 1250,130" 
          stroke="url(#stream-grad-2)" stroke-width="2.5" class="stream-line-2"/>
    <path d="M-50,220 C220,180 500,260 800,190 C1000,140 1120,230 1250,180" 
          stroke="#818cf8" stroke-width="1.5" opacity="0.4" class="stream-line-3"/>
  </g>

  <!-- Network Telemetry Nodes in Background -->
  <g fill="#38bdf8" filter="url(#neon-glow)">
    <circle cx="220" cy="180" r="4" class="node-pulse"/>
    <circle cx="480" cy="90" r="3" class="node-pulse" style="animation-delay: 1s;"/>
    <circle cx="720" cy="330" r="4.5" class="node-pulse" style="animation-delay: 1.8s;"/>
    <circle cx="980" cy="110" r="3.5" class="node-pulse" style="animation-delay: 0.6s;"/>
    <circle cx="1060" cy="270" r="4" class="node-pulse" style="animation-delay: 2.3s;"/>
  </g>

  <!-- Peripheral Tech Pills (Background Dynamic Accents, Kept Away from Center Text) -->
  <g class="float-pill-1" transform="translate(60, 45)">
    <rect width="130" height="32" rx="16" fill="url(#pill-grad)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
    <text x="65" y="21" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle" class="mono-text">⚡ ClickHouse</text>
  </g>

  <g class="float-pill-2" transform="translate(1010, 45)">
    <rect width="130" height="32" rx="16" fill="url(#pill-grad)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
    <text x="65" y="21" fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle" class="mono-text">🍷 Apache Pinot</text>
  </g>

  <g class="float-pill-3" transform="translate(50, 345)">
    <rect width="125" height="32" rx="16" fill="url(#pill-grad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <text x="62" y="21" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle" class="mono-text">🌊 StarRocks</text>
  </g>

  <g class="float-pill-4" transform="translate(1015, 345)">
    <rect width="125" height="32" rx="16" fill="url(#pill-grad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
    <text x="62" y="21" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle" class="mono-text">🦆 DuckDB</text>
  </g>

  <!-- ================= FOREGROUND CONTENT (ALWAYS CRISP & UNBLOCKED) ================= -->

  <!-- Top Category Tag -->
  <g transform="translate(600, 105)" filter="url(#shadow)">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="-145" cy="0" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="5" fill="#e2e8f0" font-size="12.5" font-weight="700" letter-spacing="1.5" text-anchor="middle" class="mono-text">
      SUB-SECOND OLAP &amp; STREAMING
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="190" text-anchor="middle" class="sans-text" filter="url(#shadow)">
    <tspan fill="url(#title-grad)" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome Real-Time Analytics Databases
    </tspan>
  </text>

  <!-- Clear, Engaging Subtitle -->
  <text x="600" y="235" text-anchor="middle" fill="#94a3b8" font-size="16.5" font-weight="500" class="sans-text" filter="url(#shadow)">
    Curated Hub of High-Performance OLAP Engines, Streaming Ingestion &amp; Real-Time Analytics
  </text>

  <!-- Metric Badges Row (Centered Foreground) -->
  <g transform="translate(600, 290)">
    <!-- Badge 1: Ultra-Low Latency -->
    <g transform="translate(-250, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle" class="mono-text">
        ⚡ &lt;100ms Query P99
      </text>
    </g>

    <!-- Badge 2: Ingestion Scale -->
    <g transform="translate(0, 0)">
      <rect x="-105" y="-16" width="210" height="32" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" fill="#a78bfa" font-size="12" font-weight="600" text-anchor="middle" class="mono-text">
        🌊 Millions Events/Sec
      </text>
    </g>

    <!-- Badge 3: Battle-Tested -->
    <g transform="translate(250, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle" class="mono-text">
        🛡️ High Concurrency
      </text>
    </g>
  </g>

  <!-- Decorative Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>
